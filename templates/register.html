<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
  <button class="btn-icon theme-float" id="btn-toggle-theme" aria-label="Alternar tema" title="Alternar tema">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="auth-card">
    <div class="auth-logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span class="logo-text">TaskFlow</span>
    </div>
    <h1>Criar conta</h1>
    <p class="auth-subtitle">Comece a organizar suas tarefas</p>

    <form id="form-register" class="auth-form">
      <div class="form-group">
        <label for="name">Nome <span class="optional">(opcional)</span></label>
        <input type="text" id="name" name="name" placeholder="Seu nome" maxlength="80" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres, com letras e números" required minlength="8" autocomplete="new-password">
      </div>
      <div class="auth-error hidden" id="auth-error"></div>
      <div class="auth-success hidden" id="auth-success"></div>
      <button type="submit" class="btn-primary btn-full" id="btn-submit">Criar conta</button>
    </form>

    <p class="auth-footer">
      Já tem conta?
      <a href="{{ url_for('login_page') }}">Entrar</a>
    </p>
  </div>

  <script>
    (function () {
      const THEME_KEY = 'taskflow_theme';
      const saved = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));

      document.getElementById('btn-toggle-theme').addEventListener('click', function () {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
      });

      const form = document.getElementById('form-register');
      const errEl = document.getElementById('auth-error');
      const okEl = document.getElementById('auth-success');
      const btn = document.getElementById('btn-submit');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errEl.classList.add('hidden');
        okEl.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Criando...';
        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: document.getElementById('name').value.trim(),
              email: document.getElementById('email').value.trim(),
              password: document.getElementById('password').value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erro ao cadastrar');
          if (data.needs_confirmation) {
            okEl.textContent = data.message || 'Verifique seu e-mail para confirmar.';
            okEl.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Criar conta';
            return;
          }
          window.location.href = '/';
        } catch (err) {
          errEl.textContent = err.message;
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Criar conta';
        }
      });
    })();
  </script>
</body>
</html>
